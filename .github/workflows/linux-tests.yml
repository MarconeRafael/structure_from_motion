name: Linux tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  unittest:
    runs-on: ubuntu-22.04
    env:
      REQUIRE_GHDL: "1"
      REQUIRE_OPENCV: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: |
          sudo apt-get update
          sudo apt-get install -y ghdl
          python -m pip install -r requirements-sfm.txt
      - run: |
          python --version
          ghdl --version
          python -c 'import cv2, numpy; print(cv2.__version__, numpy.__version__)'
      - run: |
          python - <<'PY'
          import unittest
          suite = unittest.defaultTestLoader.discover("tests")
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          raise SystemExit(not (result.wasSuccessful() and result.testsRun and not result.skipped))
          PY
